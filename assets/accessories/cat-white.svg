<?xml version="1.0" encoding="UTF-8"?>
<!-- White cat lying on the pet (head accessory). Coordinates are the pet
     viewBox units of clawd-idle-with-cat.svg, so the cat lands exactly where
     that file drew it. The canvas is symmetric about the head centre (x = 7.5)
     so the renderer can counter-flip it in place while the pet is mirrored. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.5 -1 18 8" width="18" height="8">
  <defs>
    <style>
      .cat-tail {
        transform-origin: 0px 4.5px;
        animation: tail-sway 2.4s infinite ease-in-out;
      }
      .cat-ears {
        transform-origin: 10.5px 0px;
        animation: ear-twitch 4.5s infinite ease-in-out;
      }
      .cat-eye {
        transform-origin: 10.5px 1.9px;
        animation: cat-blink 6s infinite ease-in-out;
      }

      @keyframes tail-sway {
        0%, 100% { transform: rotate(-10deg); }
        50% { transform: rotate(15deg); }
      }
      @keyframes ear-twitch {
        0%, 88%, 100% { transform: translateY(0) scaleY(1); }
        92% { transform: translateY(-0.25px) scaleY(1.2); }
        96% { transform: translateY(0) scaleY(1); }
      }
      @keyframes cat-blink {
        0%, 47%, 53%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(0.1); }
      }
    </style>
  </defs>

  <g id="cat">
    <!-- Tail (curling up-left on left end) -->
    <g class="cat-tail">
      <rect x="1" y="4" width="1" height="1" fill="#E5E5E5"/>
      <rect x="0" y="2" width="1" height="2" fill="#E5E5E5"/>
      <rect x="0" y="0" width="1" height="2" fill="#E5E5E5"/>
    </g>

    <!-- Body (thicker lying shape) -->
    <rect x="2" y="3" width="9" height="3" fill="#E5E5E5"/>
    <!-- Orange patch on back -->
    <rect x="4" y="3" width="3" height="2" fill="#E5E5E5"/>
    <!-- Black patch on rump -->
    <rect x="7" y="3" width="2" height="1.5" fill="#E5E5E5"/>

    <!-- Head (slightly chunky, sticks up) -->
    <rect x="8.5" y="0.5" width="4" height="3.5" fill="#E5E5E5"/>
    <!-- Black patch on left of head -->
    <rect x="8.5" y="0.5" width="1.2" height="1.8" fill="#E5E5E5"/>
    <!-- Orange patch on right of head -->
    <rect x="11.3" y="0.5" width="1.2" height="1.8" fill="#E5E5E5"/>

    <!-- Ears (small, poking up) -->
    <g class="cat-ears">
      <!-- Left ear (black) -->
      <rect x="8.6" y="-0.3" width="1" height="0.8" fill="#E5E5E5"/>
      <!-- Right ear (orange) -->
      <rect x="11.4" y="-0.3" width="1" height="0.8" fill="#E5E5E5"/>
    </g>

    <!-- Front paw (thick, hanging down onto Clawd's head/torso surface) -->
    <rect x="10" y="5.5" width="2" height="1.5" fill="#E5E5E5"/>

    <!-- ====== FACE (on head, front-facing) ====== -->
    <!-- Two eyes -->
    <g class="cat-eye" fill="#3A3A3A">
      <rect x="9.68" y="1.8" width="0.35" height="0.8"/>
      <rect x="10.98" y="1.8" width="0.35" height="0.8"/>
    </g>
    <!-- Nose (small pink) -->
    <rect x="10.3" y="2.75" width="0.4" height="0.3" fill="#F48FB1"/>
    <!-- Mouth (ㅅ shape — connected strokes) -->
    <rect x="10.3" y="3.1" width="0.4" height="0.22" fill="#3A3A3A"/>
    <rect x="10" y="3.25" width="0.4" height="0.2" fill="#3A3A3A"/>
    <rect x="10.6" y="3.25" width="0.4" height="0.2" fill="#3A3A3A"/>
  </g>
</svg>
